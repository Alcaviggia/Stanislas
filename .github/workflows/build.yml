name: Build Stanislas

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./stanislas-app

      # --- Ollama pour Windows : binaire officiel tout prêt, pas de compilation ---
      - name: Télécharger Ollama (Windows)
        shell: pwsh
        run: |
          $dest = "stanislas-app/src-tauri/binaries/ollama-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip" -OutFile "ollama.zip"
          Expand-Archive -Path "ollama.zip" -DestinationPath $dest -Force
          Write-Host "Ollama Windows prêt dans $dest"

      # --- Python portable : jamais testé avant, première exécution ici sur
      # un vrai Windows (celui fourni par GitHub), adapté du script .ps1
      # existant (chemin ajusté pour tourner en CI, pas en usage manuel) ---
      - name: Construire le Python portable (Windows)
        shell: pwsh
        run: |
          $DossierDest = "stanislas-app/src-tauri/binaries/python-runtime"
          $DossierTemp = "$env:TEMP\stanislas_python_build"

          Write-Host "-> Telechargement de Python 3.11 portable (Windows 64 bits)..."
          New-Item -ItemType Directory -Force -Path $DossierTemp | Out-Null
          Set-Location $DossierTemp

          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260113/cpython-3.11.14+20260113-x86_64-pc-windows-msvc-install_only_stripped.tar.gz" -OutFile "python.tar.gz"

          Write-Host "-> Extraction..."
          New-Item -ItemType Directory -Force -Path "python_extrait" | Out-Null
          tar -xzf python.tar.gz -C python_extrait

          Write-Host "-> Installation des bibliotheques necessaires (peut prendre plusieurs minutes)..."
          & ".\python_extrait\python\python.exe" -m ensurepip --upgrade
          & ".\python_extrait\python\python.exe" -m pip install --upgrade pip
          & ".\python_extrait\python\python.exe" -m pip install `
            torch diffusers transformers accelerate safetensors sentencepiece protobuf `
            Pillow python-docx python-pptx pdfplumber requests huggingface_hub numpy `
            pypdf reportlab openai-whisper

          Write-Host "-> Copie dans le projet Stanislas..."
          $CheminComplet = Join-Path $env:GITHUB_WORKSPACE $DossierDest
          New-Item -ItemType Directory -Force -Path $CheminComplet | Out-Null
          Copy-Item -Path "python_extrait\python\*" -Destination $CheminComplet -Recurse -Force

          Write-Host "Python portable pret dans $CheminComplet"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./stanislas-app
          tagName: ${{ github.ref_name }}
          releaseName: 'Stanislas ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
